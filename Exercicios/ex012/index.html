<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
 

    <video width="560   " poster="imagens/axolote-desenho.png" controls>

    </video>

<iframe width="560" height="315" src="https://www.youtube.com/embed/jNQXAC9IVRw?si=zk2FVvhxstfZ0cEt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
